# SidStack Server Stack
# PostgreSQL + API Server + MCP Server + Caddy reverse proxy
#
# Usage:
#   cp .env.example .env   # Edit with your values
#   docker compose up -d
#
# Services:
#   api-server  :19432  — REST API (central data gateway)
#   mcp-server  :19433  — MCP tools (Streamable HTTP for Claude Code)
#   bot-server  :3222   — SidBot (Gemini intent router + chat)
#   web-ui      :5174   — React SPA (browser access)
#   caddy       :80/443 — Reverse proxy with auto TLS
#
# Semantic memory: powered by SidMemo API (mem.sidcorp.co) — no local containers needed

services:
  # ===========================================================================
  # Database
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sidstack
      POSTGRES_USER: sidstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidstack_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Core Services
  # ===========================================================================

  api-server:
    build:
      context: ../
      dockerfile: docker/api-server/Dockerfile
    ports:
      - "${API_PORT:-19432}:19432"
    volumes:
      - sidstack-data:/data
    environment:
      - NODE_ENV=production
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://sidstack:${POSTGRES_PASSWORD:-sidstack_dev}@postgres:5432/sidstack
      - DATABASE_PATH=/data/sidstack.db
      - API_PORT=19432
      - SIDSTACK_API_KEY=${SIDSTACK_API_KEY}
      - SIDSTACK_CORS_ORIGINS=${SIDSTACK_CORS_ORIGINS:-}
      - SIDMEMO_API_URL=${SIDMEMO_API_URL:-https://mem.sidcorp.co}
      - SIDMEMO_API_KEY=${SIDMEMO_API_KEY}
      - SIDMEMO_PROJECT_SLUG=${SIDMEMO_PROJECT_SLUG:-sidstack}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:19432/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    build:
      context: ../
      dockerfile: docker/mcp-server/Dockerfile
    ports:
      - "${MCP_PORT:-19433}:19433"
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MCP_PORT=19433
      - SIDSTACK_API_URL=http://api-server:19432
      - SIDSTACK_MCP_KEY=${SIDSTACK_MCP_KEY:-}
      - SIDMEMO_API_URL=${SIDMEMO_API_URL:-https://mem.sidcorp.co}
      - SIDMEMO_API_KEY=${SIDMEMO_API_KEY}
      - SIDMEMO_PROJECT_SLUG=${SIDMEMO_PROJECT_SLUG:-sidstack}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:19433/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot-server:
    build:
      context: ../
      dockerfile: docker/bot-server/Dockerfile
    ports:
      - "${BOT_PORT:-3222}:3222"
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3222
      - SIDSTACK_API_URL=http://api-server:19432
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3222/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Web UI (React SPA served by Caddy)
  # ===========================================================================

  web-ui:
    build:
      context: ../
      dockerfile: docker/web-ui/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    ports:
      - "${WEB_UI_PORT:-5174}:5174"
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      - API_UPSTREAM=api-server:19432
    restart: unless-stopped

  # ===========================================================================
  # Reverse Proxy (auto TLS)
  # ===========================================================================

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-server
      - mcp-server
      - bot-server
      - web-ui
    environment:
      - API_DOMAIN=${API_DOMAIN:-api.sidstack.dev}
      - MCP_DOMAIN=${MCP_DOMAIN:-mcp.sidstack.dev}
      - BOT_DOMAIN=${BOT_DOMAIN:-bot.sidstack.dev}
      - APP_DOMAIN=${APP_DOMAIN:-app.sidstack.dev}
    restart: unless-stopped

volumes:
  pgdata:
  sidstack-data:
  caddy-data:
  caddy-config:
